# Mohobot 审核面板配置
# 复制本文件为 config.yaml 后使用(本地配置已被 .gitignore 排除)。
# 生成密码哈希: python review/hash_password.py

enabled: true                 # mohobot 启动时据此决定是否拉起本面板

server:
  host: 127.0.0.1
  port: 9091

# mohobot 数据目录(只读), 相对于仓库根; 部署在别处时填绝对路径
data_dir: "../data"

# 登录 token 有效期(秒, 活跃自动续期)
token_expiry: 3600

# 审核员账号(手工维护, 权限相同); 密码只存哈希
users:
  - username: admin
    password_hash: "pbkdf2_sha256$<salt>$<hex>"
