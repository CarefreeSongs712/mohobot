<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script>
        {{ vis_js_content | safe }}
    </script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #network-container {
            width: 100%;
            /* 预留 140px 给 header(标题加大后), 保证不和图谱重叠 */
            height: calc(100vh - 140px);
            position: relative;
        }

        .header {
            width: 100%;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #000000;
            font-size: 64px;
            font-weight: bold;
            background-color: #fff;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            /* 保证标题在最上层 */
            position: relative;
        }
    </style>
</head>

<body>
    <div class="header">🌸 群 {{ group_name }} 今日老婆羁绊图谱 🌸</div>
    <div id="network-container"></div>

    <script>
        const hourlyTag = new Date().toISOString().slice(0, 13);
        const raw_data = {{ records | tojson }};
        const user_map = {{ user_map | tojson }} || {};
        const nodes = [];
        const edges = [];
        const userSet = new Set();

        // 自适应尺寸: 节点越多头像越小, 避免拥挤/重叠
        const allIds = new Set();
        raw_data.forEach(r => { allIds.add(String(r.user_id)); allIds.add(String(r.wife_id)); });
        const nodeCount = allIds.size;
        const avatarSize = nodeCount <= 10 ? 110 : nodeCount <= 20 ? 90 : nodeCount <= 30 ? 75 : 62;
        const labelSize = avatarSize >= 90 ? 62 : avatarSize >= 75 ? 54 : 46;
        const labelVadjust = avatarSize >= 90 ? 48 : 40;

        raw_data.forEach(r => {
            const userName = user_map[r.user_id] || "用户" + r.user_id;
            const wifeName = user_map[r.wife_id] || r.wife_name;

            [{ id: r.user_id, name: userName }, { id: r.wife_id, name: wifeName }].forEach(u => {
                if (!userSet.has(u.id)) {
                    userSet.add(u.id);
                    nodes.push({
                        id: u.id,
                        label: u.name,
                        shape: 'circularImage',
                       image: `https://q4.qlogo.cn/headimg_dl?dst_uin=${u.id}&spec=640&t=${hourlyTag}`,
                        borderWidth: 6,
                        size: avatarSize,
                        color: { border: '#4facfe', background: '#ffffff' },
                        font: {
                            color: '#000000',
                            size: labelSize,
                            vadjust: labelVadjust,
                            strokeWidth: 6, // 增加描边
                            strokeColor: '#ffffff',
                            bold: { color: '#000000', size: labelSize - 6, vadjust: labelVadjust }
                        }
                    });
                }
            });

            edges.push({
                from: r.user_id,
                to: r.wife_id,
                label: r.forced ? "强娶" : "抽中",
                arrows: {to: {enabled: true,scaleFactor: 3,type: 'arrow'}},
                color: { color: r.forced ? '#ff4d4f' : '#1890ff', width: 4 },
                font: { align: 'middle', color: '#444', size: 56, background: '#ffffff' },
                length: 700 // 拉开节点间距
            });
        });

        const container = document.getElementById('network-container');
        const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            nodes: {
                shape: 'circularImage',
                font: { face: 'Microsoft YaHei' }
            },
            edges: {
                smooth: {
                    type: 'curvedCW',
                    roundness: 0.2
                }
            },
            physics: {
                enabled: true,
                // forceAtlas2(Gephi 同款): 节点均匀分散, 避免局部重叠/大片空白
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -400,  // 节点间斥力(头像大, 需更强斥力)
                    centralGravity: 0.01,         // 向心引力: 防止节点四散失衡
                    springLength: 500,            // 期望边长度
                    springConstant: 0.08,         // 弹簧强度: 软弹簧让斥力主导
                    damping: 0.6,                 // 阻尼: 越大布局越稳定
                    avoidOverlap: 1.0             // 0-1: 1=完全避免头像重叠
                },
                stabilization: {
                    enabled: true,
                    iterations: Math.max({{ iterations }}, 1000),  // 足够迭代保证收敛均匀
                    updateInterval: 25,
                    onlyDynamicEdges: false,
                    fit: true
                }
            }
        };
        const network = new vis.Network(container, data, options);
        network.once("stabilizationIterationsDone", function () {
            // 稳定后冻结布局: 否则物理引擎继续运行, 节点会重新聚拢/漂移
            network.setOptions({ physics: false });
            network.fit({ animation: false });
            // 标记渲染完成(渲染器等待此标记后截图)
            window.__graphReady = true;
        });
    </script>
</body>

</html>
