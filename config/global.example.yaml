# Mohobot Global Configuration — 模板
# ====================================
# 复制本文件为 config/global.yaml 并按需修改：
#   cp config/global.example.yaml config/global.yaml
# 注意：config/global.yaml 已被 .gitignore 排除，不会提交到仓库。

# ── Beta 模式开关 ─────────────────────────────────────────────
# true  = Agent 流水线(话题规划/记忆/反思, 按 bot 隔离)
# false = 旧版直接流式回复(main 分支逻辑; 数据库保留, 需重启生效)
beta_mode: true

# ── 全局管理员 ──────────────────────────────────────────────
# 可执行封禁命令(/ban 等)与插件管理命令(如 /群列表 /退群 /删好友)。
# 封禁系统与插件(关系管理器等)共用此列表。
admins: []

# ── 封禁系统(全局统一名单, 所有 bot 共享) ───────────────────────
# 语义: bot 静默忽略被禁用户的消息(不是 QQ 群管理封禁)。
# 会话维度: 群=group:群号, 私聊=private:QQ号。
# 优先级: 会话解禁 > 会话封禁 > 全局解禁 > 全局封禁。
ban:
  enabled: true


# ── Anysearch 实时联网搜索 ─────────────────────────────────────
# 供 Bot 在回答中获取实时外部信息(自动搜索注入 + /搜索 命令 + 旧路径工具)
anysearch:
  enabled: true
  api_key: ""                          # 必填: Anysearch API Key, 留空则搜索功能禁用
  base_url: "https://api.anysearch.com/mcp"
  timeout: 30                          # 单次请求超时(秒)

server:
  host: "0.0.0.0"
  port: 8081
  max_size: 10485760  # 10 MB
  outbound_interval: 0.5         # 每个 bot 的消息发送间隔(秒)
  outbound_maxsize: 100          # 每个 bot 的发送队列容量
  outbound_enqueue_timeout: 2.0  # 队列入队超时(秒)

llm:
  # Chat model
  chat_model: "DeepSeek-V4-Flash"
  chat_base_url: "https://api.openai.com/v1"
  chat_api_key: ""           # 必填，或设置环境变量 MOHOBOT_LLM_API_KEY
  chat_max_tokens: 131072    # 注意：过大的 max_tokens 会导致部分网关返回空流
  chat_temperature: 0.7

  # Vision model
  vision_model: "Qwen3.5-122B-A10B"
  vision_base_url: "https://api.openai.com/v1"
  vision_api_key: ""          # 必填（无视觉需求可留空），或设置环境变量 MOHOBOT_VISION_API_KEY

# ── 回复行为（系统级） ────────────────────────────────────────
reply:
  stream: true              # 是否使用流式请求（false = 等完整回复再发送）
  segment_reply: true       # 是否分段回复（标点符号+长度分隔法）
  segment_min_len: 12       # 分段最小长度（字符，低于此长度不切分）
  segment_max_len: 60       # 分段硬上限（字符，超过即使无标点也强制切）
  segment_delay_min: 0.2    # 分段发送随机延迟下限（秒）
  segment_delay_max: 0.5    # 分段发送随机延迟上限（秒）
  reply_quote: true         # 是否引用触发回复的那条消息

web_panel:
  enabled: true
  host: "127.0.0.1"
  port: 9090
  username: "admin"
  password_hash: ""           # 格式: pbkdf2_sha256$salt$hexhash
                              # 生成: python -c "import hashlib,secrets; salt=secrets.token_hex(16); h=hashlib.pbkdf2_hmac('sha256',b'你的密码',salt.encode(),100000).hex(); print(f'pbkdf2_sha256${salt}${h}')"

interceptor:
  keyword_file: "./data/keywords.json"

# ── 数据库（mohobot 独立 SQLite，架构借鉴 Agent-LuoTianyi） ─────
database:
  enabled: true
  folder: "./data/database"   # SQLite 文件所在目录
  file: "mohobot.db"          # 独立数据库文件

# ── Agent 子系统（移植自 Agent-LuoTianyi，按 bot 隔离） ─────────
agent:
  enabled: true               # 全局总开关(需重启生效); 各 bot 是否启用流水线
                              # 由每个 bot 私有配置 data/bots/{bot_id}/config.json
                              # 中的 agent_enabled 单独控制。
  # 注意: 角色名/角色人设/说话风格不在此配置 —— 每个 bot 自动使用自己的
  # nickname/persona(character_name → bot 昵称; character_persona → bot persona;
  # speaking_style → 自然、简洁)。

  # ── 歌曲知识库（全局歌曲识别 + LLM 前注入）─────────────────
  # SQLite 事实库(songs 表, 新 schema): 歌名/歌词识别不再依赖关键词 txt,
  # 直接和爬取库比对。首次启动建空库(不再复制 res 内置库);
  # 数据同步: /sync-songs 或 scripts/sync_vcpedia.py(全量/增量, Anubis PoW 自动处理)。
  # 识别命中时会在消息交给 LLM 前, 把「介绍 + 词/曲/混/调等 + 完整歌词」
  # 紧跟用户消息下方注入(仅请求级, 不写入 context)。
  music_knowledge:
    enabled: true
    song_database:
      db_folder: "./data/song_knowledge"
      db_file: "knowledge_db.db"
    crawler:
      base_url: "https://vcpedia.cn"
      categories:
        - "Category:洛天依歌曲"
        - "Category:VOCALOID中文传说曲"
  # 各 LLM 模块配置；model 留空则继承顶部 llm.* 全局配置。
  # ── 模型选型建议 ────────────────────────────────────────────
  #   main_chat / topic_extractor: 推荐 DeepSeek-V4-Flash
  #     (人设保持与中文自然度、JSON 指令跟随稳定性要求最高,
  #      8B 级模型在这两个关键路径上明显偏弱)
  #   memory_writer / user_profile_updater: 可用 Qwen3-8B 省成本降延迟
  #     (非用户可见路径, 解析失败会自动降级为空记忆/不更新, 容错高)
  #   若全部追求稳定: 4 个模块都用 DeepSeek-V4-Flash
  llm_modules:
    main_chat:                 # 回复生成(质量关键路径)
      model: "DeepSeek-V4-Flash"
      base_url: ""
      api_key: ""
      temperature: 0.7
      max_tokens: 2048
    topic_extractor:           # 话题提取, JSON 模式(流程关键路径)
      model: "DeepSeek-V4-Flash"
      base_url: ""
      api_key: ""
      temperature: 0.3
      max_tokens: 1024
    memory_writer:             # 记忆抽取, JSON 模式(非用户可见)
      model: "Qwen3-8B"
      base_url: ""
      api_key: ""
      temperature: 0.3
      max_tokens: 1024
    user_profile_updater:      # 用户画像更新(非用户可见)
      model: "Qwen3-8B"
      base_url: ""
      api_key: ""
      temperature: 0.3
      max_tokens: 1024
  memory:
    user_memory_dedup_threshold: 0.72
    vector_store:
      enabled: true            # 未安装 chromadb 或未配 key 时自动降级为无向量库模式
      provider: chroma
      persist_dir: "./data/database/chroma"
      collection_name: "mohobot_memories"
      embedding_model: "BAAI/bge-m3"   # 示例: 硅基流动 BAAI/bge-m3 (1024 维)
      embedding_base_url: "https://api.siliconflow.cn/v1"
      embedding_api_key: ""    # 必填: 填入硅基流动 API Key 后启用向量检索
  main_chat:
    max_output_lines: 12
  topic_planner:
    listen_timer:
      timeout: 1.5            # 秒：等待用户说完的静默时长
    unread_store:
      max_size: 50
  topic_replier: {}
  reflection_worker:
    enabled: true
    write_memory: true        # 对话后是否反思并写入记忆
    update_user_profile: true # 对话后是否更新用户画像
  reflex:
    enabled: true             # 戳一戳等低延迟反射回复

log_dir: "./logs"
data_dir: "./data"
plugins_dir: "./plugins"
context_max_rounds: 30
