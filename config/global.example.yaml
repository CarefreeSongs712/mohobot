# Mohobot Global Configuration — 模板
# ====================================
# 复制本文件为 config/global.yaml 并按需修改：
#   cp config/global.example.yaml config/global.yaml
# 注意：config/global.yaml 已被 .gitignore 排除，不会提交到仓库。

server:
  host: "0.0.0.0"
  port: 8081
  max_size: 10485760  # 10 MB

llm:
  # Chat model
  chat_model: "DeepSeek-V4-Flash"
  chat_base_url: "http://127.0.0.1:36712/v1"
  chat_api_key: ""           # 必填，或设置环境变量 MOHOBOT_LLM_API_KEY
  chat_max_tokens: 131072    # 注意：过大的 max_tokens 会导致部分网关返回空流
  chat_temperature: 0.7

  # Vision model
  vision_model: "Qwen3.5-122B-A10B"
  vision_base_url: "http://127.0.0.1:36712/v1"
  vision_api_key: ""          # 必填（无视觉需求可留空），或设置环境变量 MOHOBOT_VISION_API_KEY

# ── 回复行为（系统级） ────────────────────────────────────────
reply:
  stream: true              # 是否使用流式请求（false = 等完整回复再发送）
  segment_reply: true       # 是否分段回复（标点符号+长度分隔法）
  segment_min_len: 12       # 分段最小长度（字符，低于此长度不切分）
  segment_max_len: 60       # 分段硬上限（字符，超过即使无标点也强制切）
  segment_delay_min: 0.2    # 分段发送随机延迟下限（秒）
  segment_delay_max: 0.5    # 分段发送随机延迟上限（秒）
  reply_quote: true         # 是否引用触发回复的那条消息

web_panel:
  enabled: true
  host: "127.0.0.1"
  port: 9090
  username: "admin"
  password_hash: ""           # 格式: pbkdf2_sha256$salt$hexhash
                              # 生成: python -c "import hashlib,secrets; salt=secrets.token_hex(16); h=hashlib.pbkdf2_hmac('sha256',b'你的密码',salt.encode(),100000).hex(); print(f'pbkdf2_sha256${salt}${h}')"

interceptor:
  keyword_file: "./data/keywords.json"

# ── 数据库（与 Agent-LuoTianyi 共享同一个 SQLite） ───────────────
database:
  enabled: true
  folder: "./data/database"   # SQLite 文件所在目录
  file: "luotianyi.db"        # 与 Agent-LuoTianyi 相同文件名 → 共用同一数据库

# ── Agent 子系统（移植自 Agent-LuoTianyi，按 bot 隔离） ─────────
agent:
  enabled: true               # false = 使用旧版直接流式回复路径
  # 人设: 默认留空 —— 每个 bot 使用各自的 data/bots/{bot_id}/config.json
  # 中的 persona(角色名回退到 bot 昵称, 说话风格默认"自然、简洁")。
  # 如需全局统一人设, 在这里填写即可覆盖所有 bot。
  persona:
    character_name: ""        # 留空 = 使用各 bot 昵称
    character_persona: ""     # 留空 = 使用各 bot 自己的 persona
    speaking_style: ""        # 留空 = 自然、简洁
  # 各 LLM 模块配置；留空继承顶部 llm.* 全局配置
  llm_modules:
    main_chat:
      model: ""               # 覆盖全局 chat_model
      base_url: ""
      api_key: ""
      temperature: 0.7
      max_tokens: 2048
    topic_extractor:
      model: ""
      base_url: ""
      api_key: ""
      temperature: 0.3
      max_tokens: 1024
    memory_writer:
      model: ""
      base_url: ""
      api_key: ""
      temperature: 0.3
      max_tokens: 1024
    user_profile_updater:
      model: ""
      base_url: ""
      api_key: ""
      temperature: 0.3
      max_tokens: 1024
  memory:
    user_memory_dedup_threshold: 0.72
    vector_store:
      enabled: true            # 未安装 chromadb 或未配 key 时自动降级为无向量库模式
      provider: chroma
      persist_dir: "./data/database/chroma"
      collection_name: "mohobot_memories"
      embedding_model: "BAAI/bge-m3"   # 示例: 硅基流动 BAAI/bge-m3 (1024 维)
      embedding_base_url: "https://api.siliconflow.cn/v1"
      embedding_api_key: ""    # 必填: 填入硅基流动 API Key 后启用向量检索
  main_chat:
    max_output_lines: 12
  topic_planner:
    listen_timer:
      timeout: 1.5            # 秒：等待用户说完的静默时长
    unread_store:
      max_size: 50
  topic_replier: {}
  reflection_worker:
    enabled: true
    write_memory: true        # 对话后是否反思并写入记忆
    update_user_profile: true # 对话后是否更新用户画像
  reflex:
    enabled: true             # 戳一戳等低延迟反射回复

log_dir: "./logs"
data_dir: "./data"
plugins_dir: "./plugins"
context_max_rounds: 30
