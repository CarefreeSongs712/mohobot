name: 功能建议
description: 提出新功能或改进建议（不承诺一定实现）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [AGENTS.md](https://github.com/CarefreeSongs712/mohobot/blob/dev/AGENTS.md) 与 [TODO.md](https://github.com/CarefreeSongs712/mohobot/blob/dev/TODO.md)，确认建议不与现有设计约束或已记录决策冲突。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接指定实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、配置或命令形态；如涉及数据/接口变化请说明兼容性影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 不做的理由
      description: 是否考虑过其他实现或现有配置能否满足。
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 核心消息链/生命周期
        - 插件或插件系统
        - Web 面板/审核面板
        - 配置与部署
        - 文档
        - 其他
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue/PR，未发现重复
          required: true
