name: Compatibility

# Deliberately NOT triggered on pull requests: Python 3.10 currently stalls part way
# through the suite (cross-test accumulation, reproducible locally), so keeping it on
# the PR path would paint every pull request red for an unresolved question.
# It stays scheduled + manually runnable so the compatibility signal keeps being
# collected, and the bounded timeout keeps runs from burning the job budget.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"   # Sundays 21:00 UTC
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python 3.10 is the minimum version declared in README. It is tracked here
  # rather than in the PR gate until the suite runs cleanly on it.
  py310:
    name: Tests (Python 3.10, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py mohobot plugins review scripts tests
      - name: Run individual test cases (bounded, with stack dump on stall)
        run: |
          set -o pipefail
          timeout --kill-after=30s 6m python -m pytest -q -o faulthandler_timeout=120 \
            tests --ignore=tests/test_concurrency.py 2>&1 | tee pytest-py310.log
      - name: Run legacy regression runner
        run: timeout --kill-after=30s 6m python tests/_run_all.py 2>&1 | tee runner-py310.log
      - name: Run concurrency regression
        run: timeout --kill-after=30s 4m python tests/test_concurrency.py 2>&1 | tee concurrency-py310.log
      - name: Upload Python 3.10 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py310-compat-logs
          path: |
            pytest-py310.log
            runner-py310.log
            concurrency-py310.log
          if-no-files-found: warn
