name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py mohobot plugins review scripts tests
      - name: Run individual test cases
        run: timeout --kill-after=30s 8m python -m pytest -q -o faulthandler_timeout=120 tests --ignore=tests/test_concurrency.py
      - name: Run legacy regression runner
        run: timeout --kill-after=30s 8m python tests/_run_all.py
      - name: Run concurrency regression
        run: timeout --kill-after=30s 5m python tests/test_concurrency.py

  syntax:
    name: Syntax and control-flow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - run: python -m ruff check --isolated --select E9,F63,F7 main.py mohobot plugins review scripts tests

  meme-plugin:
    name: Meme plugin regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            plugins/meme_stealer/requirements-dev.txt
            plugins/meme_stealer/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run plugin tests
        working-directory: plugins/meme_stealer
        run: python -m pytest -q -rs tests
      - name: Check plugin lint
        working-directory: plugins/meme_stealer
        run: python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 main.py meme_stealer_core tests

  # Informational: the repository still carries pre-existing Ruff debt. This job
  # reports it (step summary + artifact) and stays green so a known debt does not
  # masquerade as a failed gate on every pull request. Blocking checks are the
  # three jobs above; tighten this one into a gate only after the debt is cleared.
  lint-report:
    name: Ruff debt report (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - name: Collect existing lint findings
        run: |
          set -o pipefail
          python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 --output-format concise \
            main.py mohobot plugins review scripts tests > ruff-report.txt || true
          total=$(grep -cE ':[0-9]+:[0-9]+: [A-Z]+[0-9]+' ruff-report.txt || true)
          {
            echo "### Ruff debt report"
            echo ""
            echo "Existing findings (not introduced by this pull request): **${total}**"
            echo ""
            echo '```'
            grep -oE ' [A-Z]+[0-9]+ ' ruff-report.txt | sort | uniq -c | sort -rn || true
            echo '```'
            echo ""
            echo "Full list: the \`ruff-debt-report\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-debt-report
          path: ruff-report.txt
          if-no-files-found: warn
