name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            experimental: false
          - python: "3.10"
            experimental: true
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py mohobot plugins review scripts tests
      - name: Run individual test cases
        run: python -m pytest -q tests --ignore=tests/test_concurrency.py
      - name: Run legacy regression runner
        run: python tests/_run_all.py
      - name: Run concurrency regression
        run: python tests/test_concurrency.py

  syntax:
    name: Syntax and control-flow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - run: python -m ruff check --isolated --select E9,F63,F7 main.py mohobot plugins review scripts tests

  meme-plugin:
    name: Meme plugin regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            plugins/meme_stealer/requirements-dev.txt
            plugins/meme_stealer/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run plugin tests
        working-directory: plugins/meme_stealer
        run: python -m pytest -q -rs tests
      - name: Check plugin lint
        working-directory: plugins/meme_stealer
        run: python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 main.py meme_stealer_core tests

  lint-report:
    name: Full lint report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - name: Record existing lint findings
        run: python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 --output-format concise main.py mohobot plugins review scripts tests > ruff-report.txt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-lint-report
          path: ruff-report.txt
          if-no-files-found: warn
