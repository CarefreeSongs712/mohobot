name: CI

on:
  push:
    # main = 发布分支; dev = 集成分支。
    # 维护者授权「极简改动可直推 dev」, 因此 dev 也必须跑门禁,
    # 否则直推会绕过全部测试/语法检查。
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR 和 dev 直推都取消旧运行以省资源；但 push 到发布分支 main 不能取消，
  # 否则连续合并两次会让前一个提交的门禁被 cancel，留下未验证的提交（显示为红叉）。
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py mohobot plugins review scripts tests
      - name: Run individual test cases
        run: timeout --kill-after=30s 8m python -m pytest -q -n auto --dist loadfile -o faulthandler_timeout=120 tests --ignore=tests/test_concurrency.py  # loadfile: 同文件用例同 worker, 避免顺序/模块状态依赖
      # 该文件只有 main()，pytest 收集 0 个用例、旧 runner 也记 PASS 但跑 0 个；
      # 显式执行，保证插件热重载回归在 CI 真正被覆盖（约 0.1s）。
      - name: Run plugin hot-reload regression
        run: timeout --kill-after=30s 2m python tests/test_plugin_reload.py
      # smoke_startup 是脚本不是 pytest 用例，pytest 收集不到；显式执行以覆盖
      # main.py 装配/生命周期（mock 服务、无真实 sockets）。
      - name: Run startup/shutdown smoke test
        run: timeout --kill-after=30s 3m python tests/smoke_startup.py
      # legacy runner 覆盖是 pytest 的子集（且对 unittest 类/协程有假绿），
      # 仅在发布线 push main 时作为额外保险运行，PR 阶段省 ~100s。
      - name: Run legacy regression runner (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: timeout --kill-after=30s 8m python tests/_run_all.py
      - name: Run concurrency regression
        run: timeout --kill-after=30s 5m python tests/test_concurrency.py

  minimum-dependencies:
    # requirements 只写范围时 CI 默认装最新版, 下限破了也看不出来。
    # 这里钉住 websockets 声明的最低版本(13.0, asyncio.server 引入版本),
    # 实际导入并构造 WsServer, 防止再次写出不可启动的下限(issue #134)。
    name: Minimum dependency floor (websockets 13.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and pin floor version
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "websockets==13.0"
          python -m pip check
      - name: Verify lowest supported websockets imports and constructs
        run: python -m pytest -q tests/test_ws_websockets_floor.py

  syntax:
    name: Syntax and control-flow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - run: python -m ruff check --isolated --select E9,F63,F7 main.py mohobot plugins review scripts tests

  # 只检查本次改动新增/修改的 Python 文件: 存量 Ruff 债务不阻塞, 但新代码
  # 不能继续引入 E4/E7/E9/F 类问题。全量债务仍由 lint-report 汇总。
  lint-changed:
    name: Lint changed Python files (new code)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # 需要 base commit 才能计算 diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可用的 base commit（workflow_dispatch 等），跳过改动文件 lint。"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit ${BASE_SHA} 不在本地历史中，无法计算 diff。" >&2
            exit 1
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "本次没有 Python 文件改动。"
            exit 0
          fi
          printf '检查 %d 个改动文件:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 "${files[@]}"
      - name: Check whitespace errors in diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          git diff --check "${BASE_SHA}...HEAD"

  meme-plugin:
    name: Meme plugin regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            plugins/meme_stealer/requirements-dev.txt
            plugins/meme_stealer/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run plugin tests
        working-directory: plugins/meme_stealer
        run: python -m pytest -q -rs tests
      - name: Check plugin lint
        working-directory: plugins/meme_stealer
        run: python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 main.py meme_stealer_core tests

  # Informational: the repository still carries pre-existing Ruff debt. This job
  # reports it (step summary + artifact) and stays green so a known debt does not
  # masquerade as a failed gate on every pull request. Blocking checks are the
  # three jobs above; tighten this one into a gate only after the debt is cleared.
  lint-report:
    name: Ruff debt report (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - name: Collect existing lint findings
        run: |
          set -o pipefail
          # 区分「ruff 判定有告警」(exit 1) 与「ruff 自己没跑起来」(其它非零码/无输出):
          # 后者不能显示成「0 条债务」。
          status=0
          python -m ruff check --isolated --select E4,E7,E9,F --ignore E402 --output-format concise \
            main.py mohobot plugins review scripts tests > ruff-report.txt 2> ruff-stderr.txt || status=$?
          total=$(grep -cE ':[0-9]+:[0-9]+: [A-Z]+[0-9]+' ruff-report.txt || true)
          {
            echo "### Ruff debt report"
            echo ""
            if [ "$total" -eq 0 ] && { [ -s ruff-stderr.txt ] || { [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; }; }; then
              echo "**Ruff 未正常完成（退出码 ${status}）**，本次报告不可用——这不是「0 条债务」。"
              echo ""
              echo '```'
              tail -n 5 ruff-stderr.txt || true
              echo '```'
            elif [ "$total" -eq 0 ]; then
              echo "本规则集下没有告警。"
            else
              echo "Existing findings (not introduced by this pull request): **${total}**"
              echo ""
              echo '```'
              grep -oE ' [A-Z]+[0-9]+ ' ruff-report.txt | sort | uniq -c | sort -rn || true
              echo '```'
              echo ""
              echo "Full list: the \`ruff-debt-report\` artifact of this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-debt-report
          path: ruff-report.txt
          if-no-files-found: warn
